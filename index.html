<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>약물 정보 조회 - Acetaminophen</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; background: #f4f6fa; margin: 0; padding: 24px 16px; color: #222; }
    .card { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .sub { color: #666; margin: 0 0 20px; }
    button { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 1rem; cursor: pointer; }
    button:disabled { background: #94a3b8; }
    img { display: block; margin: 20px auto; max-width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #e5e7eb; word-break: break-all; }
    th { width: 40%; color: #555; font-weight: normal; }
    .status { margin-top: 16px; color: #666; }
    .error { color: #dc2626; }
    footer { text-align: center; color: #888; font-size: .85rem; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Acetaminophen (타이레놀)</h1>
    <p class="sub">해열·진통제 · PubChem API로 특성 정보 조회</p>
    <button id="loadBtn">정보 조회하기</button>
    <p id="status" class="status"></p>
    <div id="result"></div>
  </div>
  <footer>Data: PubChem (NCBI) PUG REST API</footer>

  <script>
    const DRUG = "acetaminophen";
    const BASE = "https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/";
    const PROPS = "MolecularFormula,MolecularWeight,IUPACName,XLogP,HBondDonorCount,HBondAcceptorCount,CanonicalSMILES";

    const btn = document.getElementById("loadBtn");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");

    async function loadDrugInfo() {
      btn.disabled = true;
      statusEl.className = "status";
      statusEl.textContent = "PubChem에서 조회 중...";
      resultEl.innerHTML = "";

      try {
        const res = await fetch(`${BASE}${DRUG}/property/${PROPS}/JSON`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const p = data.PropertyTable.Properties[0];

        const rows = [
          ["PubChem CID", p.CID],
          ["분자식", p.MolecularFormula],
          ["분자량", `${p.MolecularWeight} g/mol`],
          ["IUPAC 이름", p.IUPACName],
          ["XLogP (지용성)", p.XLogP],
          ["수소결합 공여체 수", p.HBondDonorCount],
          ["수소결합 수용체 수", p.HBondAcceptorCount],
          ["SMILES", p.ConnectivitySMILES || p.CanonicalSMILES],
        ];

        resultEl.innerHTML = `
          <img src="${BASE}${DRUG}/PNG" alt="Acetaminophen 구조식">
          <table>${rows.map(([k, v]) => `<tr><th>${k}</th><td>${v ?? "-"}</td></tr>`).join("")}</table>
          <p><a href="https://pubchem.ncbi.nlm.nih.gov/compound/${p.CID}" target="_blank">PubChem에서 자세히 보기</a></p>`;
        statusEl.textContent = "조회 완료!";
      } catch (err) {
        statusEl.className = "status error";
        statusEl.textContent = `조회 실패: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", loadDrugInfo);
  </script>
</body>
</html>
